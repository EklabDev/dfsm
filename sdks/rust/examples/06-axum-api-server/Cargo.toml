[package]
name = "dfsm-axum-api-server"
version = "1.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dfsm-axum-api-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
eklabdev-dfsm = { path = "../../" }

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
